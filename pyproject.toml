[project]
name = "campus-assistant"
version = "0.1.0"
description = "Local study assistant: Brightspace sync, mail ingest, deadlines API"
readme = "README.md"
authors = [
    { name = "spiralsky", email = "shianastrophysics@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.12.1",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
campus = "campus_assistant.cli:main"
campus-kde = "campus_assistant.kde_app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=campus_assistant --cov-report=term-missing"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
